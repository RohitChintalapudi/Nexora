<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%">
  <!-- Crisp Solid White Background -->
  <rect width="40" height="40" rx="8" fill="#FFFFFF" />
  
  <!-- Stylized Connected Black 'N' Letter -->
  <path
    d="M 11 30 L 11 10 L 29 30 L 29 10"
    stroke="#000000"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  
  <!-- Inner Black Network Nodes -->
  <circle cx="11" cy="10" r="3.5" fill="#000000" />
  <circle cx="11" cy="30" r="3.5" fill="#000000" />
  <circle cx="20" cy="20" r="3.2" fill="#000000" />
  <circle cx="29" cy="10" r="3.5" fill="#000000" />
  <circle cx="29" cy="30" r="3.5" fill="#000000" />
</svg>